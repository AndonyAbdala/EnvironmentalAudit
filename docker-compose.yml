services:
  db:
    image: postgres:15
    container_name: environmental-audit-db
    environment:
      POSTGRES_DB: environmental_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - environmental_audit_data:/var/lib/postgresql/data

  api:
    build:
      context: ./EnvironmentalAudit.Api
      dockerfile: Dockerfile
    container_name: environmental-audit-api
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DOCKER: "true"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=environmental_audit;Username=postgres;Password=${POSTGRES_PASSWORD}"
    depends_on:
      - db

  frontend:
    build:
      context: ./environmental-audit-web
      dockerfile: Dockerfile
    container_name: environmental-audit-web
    ports:
      - "8090:80"
    depends_on:
      - api

volumes:
  environmental_audit_data:
    external: true
    name: environmentalaudit_postgres_data
