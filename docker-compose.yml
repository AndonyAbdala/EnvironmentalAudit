services:
  postgres:
    image: postgres:15
    container_name: environmental-audit-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: environmental_audit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: